appId: com.ejsal.libris
productName: Libris
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Libris
